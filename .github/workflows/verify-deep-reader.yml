name: Verify deep-paper reader

on:
  push:
    branches: [main]
    paths:
      - 'radar/deep_read.py'
      - 'tests/test_deep_reader.py'
      - '.github/workflows/verify-deep-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile radar/deep_read.py
      - run: python -m unittest discover -s tests -v
